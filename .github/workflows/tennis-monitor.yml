
name: Tennis Court Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-court-monitor
  cancel-in-progress: false

jobs:
  check-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previous slot state
        uses: actions/cache/restore@v4
        with:
          path: seen_slots.json
          key: tennis-slot-state-${{ github.run_id }}
          restore-keys: |
            tennis-slot-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check tennis court availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKING_FORM_ID: ${{ secrets.BOOKING_FORM_ID }}
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          DAYS_AHEAD: ${{ secrets.DAYS_AHEAD }}
          STATE_FILE: seen_slots.json
        run: python monitor.py

      - name: Save updated slot state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: seen_slots.json
          key: tennis-slot-state-${{ github.run_id }}
